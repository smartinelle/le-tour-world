[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalride"
version = "0.1.0"
description = "Terminal-first indoor cycling app"
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.1.0",
    "rich>=14.1.0",
    "numpy>=2.3.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.17.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true