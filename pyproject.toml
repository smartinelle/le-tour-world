[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "le-tour"
version = "0.2.0"
description = "Web-based indoor cycling app"
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.1.0",
    "numpy>=2.3.0",
    "pydantic>=2.11.0",
    "nicegui>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.17.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
]
e2e = [
    "playwright>=1.45",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
